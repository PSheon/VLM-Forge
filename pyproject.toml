[project]
name = "vlmforge"
version = "0.1.0"
description = "VLM-Forge: LoRA fine-tuning, evaluation and human-supervision UI for Moondream 3.1"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14,<3",
    "safetensors>=0.6,<1",
    "tokenizers>=0.22,<1",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "pyyaml>=6",
    "tensorboard>=2.20",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
capture = ["av>=14"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
    "httpx>=0.27",
    "vlmforge[ui]",
]

[project.scripts]
forge = "vlmforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlmforge"]

# GB300 (aarch64) takes PyPI's CUDA build; CI (x86_64) takes the CPU build so lint + tests
# do not download the CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "platform_machine == 'x86_64'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
