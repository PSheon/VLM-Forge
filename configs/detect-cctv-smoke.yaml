# Smoke test of the trainer: tiny mixture, 20 steps. Rows come from the UI's export
# (workspace corrections, GOALS §7: experimental runs may read them directly).
name: detect-cctv-smoke
seed: 0
rank: 16
alpha: 32
region_head: true
gpu_mem_gb: 60
data:
  train:
    - {path: workspace/export/cctv-detect-train.jsonl, weight: 1.0}
  exclude:
    - data/manifests/heldout-cctv.jsonl
    - data/manifests/heldout-crowdhuman-val.jsonl
    - data/manifests/heldout-people-posture-gold.jsonl
  val_images: 8
  max_objects: 50
  max_text: 384
  workers: 16
replay:
  ratio: 0.5
  images: 16
  per_image_text: 2
  per_image_spatial: 1
  batch: 32
optim:
  lr: 2.0e-4
  warmup: 5
  steps: 20
  batch: 8
  min_lr_ratio: 0.1
  clip: 1.0
log_every: 5
eval_every: 20
eval_batches: 2
save_every: 20
